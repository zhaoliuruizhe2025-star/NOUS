[package]
name = "nous"
version = "0.1.0"
description = "A local-first space for remembering, connecting, and reflecting"
authors = ["NOUS contributors"]
edition = "2021"

[lib]
name = "nous_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
